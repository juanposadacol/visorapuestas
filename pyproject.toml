[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visorunder"
version = "1.0.0"
description = "Visor local de metricas UNDER para baloncesto: lee la pantalla y calcula. No apuesta."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Dependencias minimas para ejecutar la aplicacion. Todas locales y gratuitas.
dependencies = [
    "PySide6-Essentials>=6.6",     # interfaz
    "mss>=9.0",                    # captura de pantalla multiplataforma
    "opencv-python-headless>=4.9",  # preprocesado de imagen
    "numpy>=1.24",
    "rapidocr-onnxruntime>=1.3",   # motor OCR local (trae los modelos incluidos)
    "pynput>=1.7",                 # atajos de teclado globales
]

[project.optional-dependencies]
# Motor OCR alternativo. Requiere instalar aparte el binario de Tesseract.
tesseract = ["pytesseract>=0.3.10", "Pillow>=10.0"]
# Captura mas rapida en Windows (Desktop Duplication API).
dxcam = ["dxcam>=0.0.5"]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pyinstaller>=6.4"]

[project.scripts]
visorunder = "visorunder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
