<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>VisorApuestas DOM Diagnostic</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>VISORAPUESTAS DOM DIAGNOSTIC</h1>
    <p class="sub">Solo lectura. No apuesta, no navega y no modifica la pagina.</p>
  </header>

  <section id="estado" class="card">
    <div class="fila"><span class="etiqueta">Sitio</span><span id="sitio" class="valor">--</span></div>
    <div class="fila"><span class="etiqueta">URL</span><span id="url" class="valor mono">--</span></div>
    <div class="fila"><span class="etiqueta">Mercado visualmente activo</span><span id="visible" class="valor">--</span></div>
    <div class="fila"><span class="etiqueta">Ultimo escaneo</span><span id="escaneo" class="valor mono">--</span></div>
    <div class="fila"><span class="etiqueta">Entorno</span><span id="entorno" class="valor">--</span></div>
  </section>

  <section class="card">
    <h2>Mercados encontrados en DOM</h2>
    <div id="mercados"></div>
  </section>

  <section class="card">
    <h2>Lineas por mercado</h2>
    <div id="lineas"></div>
  </section>

  <section class="card">
    <h2>Historial de la sesion</h2>
    <div id="historial" class="mono pequeno"></div>
  </section>

  <section class="card" id="tarjeta-debug" hidden>
    <h2>Debug</h2>
    <div id="debug" class="mono pequeno"></div>
  </section>

  <footer>
    <label class="check"><input type="checkbox" id="ver-debug"> Mostrar debug</label>
    <div class="botones">
      <button id="copiar-texto" class="primario">COPIAR DIAGNOSTICO</button>
      <button id="copiar-json">COPIAR JSON</button>
      <button id="descargar">DESCARGAR JSON</button>
      <button id="refrescar">REFRESCAR</button>
    </div>
    <p id="aviso" class="aviso"></p>
  </footer>

  <script src="lib/text.js"></script>
  <script src="lib/markets.js"></script>
  <script src="lib/lines.js"></script>
  <script src="lib/dedupe.js"></script>
  <script src="lib/visibility.js"></script>
  <script src="lib/scan.js"></script>
  <script src="lib/report.js"></script>
  <script src="lib/payload.js"></script>
  <script src="popup.js"></script>
</body>
</html>
